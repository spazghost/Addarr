$kind: http-request
description: Create a new tag in Sonarr. Used to tag series with the Telegram user ID or custom labels.
method: POST
url: "{{sonarr_base_url}}/tag"
order: 11000
headers:
  Content-Type: application/json
  X-Api-Key: "{{sonarr_apikey}}"
body:
  type: json
  content: |-
    {
      "id": 1,
      "label": "telegram"
    }
